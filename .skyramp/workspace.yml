# Skyramp Workspace Configuration
workspace:
  repoName: sxarsky/eval-ghost
  repoUrl: https://github.com/sxarsky/eval-ghost
metadata:
  schemaVersion: v1
  executorVersion: v1.3.40
  createdAt: "2026-08-27T04:08:38.148Z"
  updatedAt: "2026-08-27T04:08:38.151Z"
services:
  - serviceName: ghost
    language: typescript
    framework: playwright
    testDirectory: e2e/tests
    api:
      authType: bearer
      authHeader: Authorization
      authScheme: Ghost
      baseUrl: http://localhost:2368/ghost/api/admin
    runtimeDetails:
      serverStartCommand: docker compose -f compose.dev.yaml up -d ghost-dev
      runtime: docker
      dockerNetwork: ghost_dev
  - serviceName: ghost-content
    language: typescript
    framework: playwright
    testDirectory: e2e/tests/content
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:2368/ghost/api/content
    runtimeDetails:
      serverStartCommand: docker compose -f compose.dev.yaml up -d ghost-dev
      runtime: docker
      dockerNetwork: ghost_dev
