# Skyramp Workspace Configuration
workspace:
  repoName: sxarsky/eval-ghost
  repoUrl: https://github.com/sxarsky/eval-ghost
metadata:
  schemaVersion: v1
  executorVersion: v1.3.40
  createdAt: "2026-08-28T22:13:55.857Z"
  updatedAt: "2026-08-28T22:13:55.858Z"
services:
  - serviceName: ghost
    language: typescript
    framework: playwright
    testDirectory: e2e/tests
    api:
      authType: bearer
      authHeader: Authorization
      authScheme: Ghost
      baseUrl: http://localhost:2368/ghost/api/admin
    runtimeDetails:
      serverStartCommand: docker compose -f docker-compose.eval.yml -p ghost-eval up -d --wait ghost
      runtime: docker
      dockerNetwork: ghost-eval_default
  - serviceName: ghost-content
    language: typescript
    framework: playwright
    testDirectory: e2e/tests/public
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:2368/ghost/api/content
    runtimeDetails:
      serverStartCommand: docker compose -f docker-compose.eval.yml -p ghost-eval up -d --wait ghost
      runtime: docker
      dockerNetwork: ghost-eval_default
