# Skyramp Workspace Configuration
workspace:
  repoName: sxarsky/eval-ghost
  repoUrl: https://github.com/sxarsky/eval-ghost
metadata:
  schemaVersion: v1
  executorVersion: v1.3.38
  createdAt: "2026-08-20T09:25:26.310Z"
  updatedAt: "2026-08-20T09:25:26.311Z"
services:
  - serviceName: ghost
    language: typescript
    framework: playwright
    testDirectory: e2e/tests
    api:
      authType: bearer
      authHeader: Authorization
      authScheme: Ghost
      baseUrl: http://localhost:2368/ghost/api/admin
    runtimeDetails:
      runtime: local
      testSuites:
        - testRunCommand: npx playwright test
          testEnv:
            SKYRAMP_TEST_BASE_URL: http://localhost:2368/ghost/api/admin
  - serviceName: ghost-content
    language: typescript
    framework: playwright
    testDirectory: e2e/tests/content
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:2368/ghost/api/content
    runtimeDetails:
      runtime: local
